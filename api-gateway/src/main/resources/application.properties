spring.application.name=api-gateway
server.port=8080

security.jwt.secret=kY+FNJ/HIRdG/mpLHGWL4mRfSGyknywI3bp8PmCdGho=

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway config (nuevo prefijo WebFlux)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=CRUD-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CRUD-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/objects/**
