spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Locator por descubrimiento
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# ============================================
# RUTAS DE MICROSERVICIOS
# ============================================

# Ruta 0: auth-service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Ruta 1: transact-service
spring.cloud.gateway.server.webflux.routes[1].id=transact-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://TRANSACT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transact/**

# Ruta 2: banks-service
spring.cloud.gateway.server.webflux.routes[2].id=banks-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BANKS-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/users/**

# ============================================
# CONFIGURACIÓN DE LOAD BALANCER (opcional)
# ============================================
# Habilitar el cliente de load balancer
spring.cloud.loadbalancer.ribbon.enabled=false
