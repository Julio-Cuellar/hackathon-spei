# ============================================
# CONFIGURACI�N DEL SERVIDOR
# ============================================
spring.application.name=financial-instruments-service
server.port=8486

# ============================================
# CONFIGURACI�N DE BASE DE DATOS MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/financial_instruments?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=morenopelon2011
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACI�N JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# ============================================
# CONFIGURACI�N DE EUREKA CLIENT
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================
# CONFIGURACI�N DE RabbitMQ
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ============================================
# CONFIGURACI�N DE SPRING CLOUD STREAM
# ============================================
# IMPORTANTE: Ambos consumers separados por punto y coma
spring.cloud.function.definition=userCreated;cuentaClabeAdded

# ============================================
# CONSUMER 1: Eventos de creaci�n de usuarios
# ============================================
spring.cloud.stream.bindings.userCreated-in-0.destination=user.events
spring.cloud.stream.bindings.userCreated-in-0.group=financial-instruments-service
spring.cloud.stream.bindings.userCreated-in-0.contentType=application/json

spring.cloud.stream.bindings.userCreated-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffInitialInterval=1000
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMultiplier=2.0
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMaxInterval=5000

spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.bindingRoutingKey=user.created
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.autoBindDlq=true

# ============================================
# CONSUMER 2: Eventos de cuenta CLABE agregada
# ============================================
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.destination=bank.events
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.group=financial-instruments-service
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.contentType=application/json

spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.backOffInitialInterval=1000
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.backOffMultiplier=2.0
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.backOffMaxInterval=5000

spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-in-0.consumer.bindingRoutingKey=cuenta.clabe.added
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-in-0.consumer.autoBindDlq=true

# ============================================
# CONFIGURACI�N DE LOGGING
# ============================================
logging.level.com.cuellar.financialstruments=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.stream=DEBUG
logging.level.org.springframework.amqp=DEBUG
