spring.application.name=transact-service
server.port=8490

# MySQL transaction_service
spring.datasource.url=jdbc:mysql://localhost:3306/transaction_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# RabbitMQ (conexión)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ============================================
# Spring Cloud Function - Múltiples Consumers
# ============================================
# Definición de múltiples funciones separadas por punto y coma
spring.cloud.function.definition=userCreated;cuentaClabeAdded

# ============================================
# CONSUMER 1: Eventos de creación de usuarios
# ============================================
# Spring Cloud Stream - binding del consumidor UserCreated
spring.cloud.stream.bindings.userCreated-in-0.destination=user.events
spring.cloud.stream.bindings.userCreated-in-0.group=transact-service
spring.cloud.stream.bindings.userCreated-in-0.contentType=application/json

# Retries del consumidor UserCreated
spring.cloud.stream.bindings.userCreated-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffInitialInterval=1000
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMultiplier=2.0
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMaxInterval=5000

# RabbitMQ específico del consumidor UserCreated
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.bindingRoutingKey=user.created
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.autoBindDlq=true

# ============================================
# CONSUMER 2: Eventos de cuenta CLABE agregada
# ============================================
# Spring Cloud Stream - binding del consumidor CuentaClabeAdded
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.destination=bank.events
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.group=transact-service
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.contentType=application/json

# Retries del consumidor CuentaClabeAdded
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.backOffInitialInterval=1000
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.backOffMultiplier=2.0
spring.cloud.stream.bindings.cuentaClabeAdded-in-0.consumer.backOffMaxInterval=5000

# RabbitMQ específico del consumidor CuentaClabeAdded
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-in-0.consumer.bindingRoutingKey=cuenta.clabe.added
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-in-0.consumer.autoBindDlq=true

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging.level.com.cuellar.transactservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.stream=DEBUG
logging.level.org.springframework.amqp=DEBUG
