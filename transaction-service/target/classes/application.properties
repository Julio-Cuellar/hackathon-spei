# ============================================
# CONFIGURACI�N DEL SERVIDOR
# ============================================
spring.application.name=transaction-service
server.port=8485

# ============================================
# CONFIGURACI�N DE BASE DE DATOS MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/object?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACI�N JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuraci�n de charset UTF-8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# ============================================
# CONFIGURACI�N DE EUREKA CLIENT (si lo usas)
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================
# CONFIGURACI�N DE ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# CONFIGURACI�N DE SPRING SECURITY (Opcional)
# ============================================
# Si quieres deshabilitar temporalmente la seguridad para pruebas:
# spring.security.enabled=false

# ============================================
# CONFIGURACI�N DE LOGGING
# ============================================
logging.level.com.cuellar.transactionservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
