spring.application.name=CRUD-service
server.port=8485

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/object?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Spring Cloud Stream - consumer binding
spring.cloud.stream.bindings.userCreated-in-0.destination=user.events
spring.cloud.stream.bindings.userCreated-in-0.group=crud-service
spring.cloud.stream.bindings.userCreated-in-0.contentType=application/json

# Rabbit-specific consumer settings
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.durableSubscription=true
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.binding-routing-key=user.created

spring.cloud.stream.bindings.userCreated-in-0.consumer.concurrency=1
