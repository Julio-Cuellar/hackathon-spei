spring.application.name=auth-service
server.port=8484

# JWT
security.jwt.secret=kY+FNJ/HIRdG/mpLHGWL4mRfSGyknywI3bp8PmCdGho=
security.jwt.issuer=kY+FNJ/HIRdG/mpLHGWL4mRfSGyknywI3bp8PmCdGho=
security.jwt.audience=prueba

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false


# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Spring Cloud Stream - producer binding
spring.cloud.stream.bindings.userCreated-out-0.destination=user.events
spring.cloud.stream.bindings.userCreated-out-0.contentType=application/json

# Rabbit-specific producer settings (topic routing key opcional)
spring.cloud.stream.rabbit.bindings.userCreated-out-0.producer.routing-key-expression='user.created'