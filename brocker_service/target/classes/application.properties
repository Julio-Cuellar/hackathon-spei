# ============================================
# CONFIGURACI�N DEL SERVIDOR
# ============================================
spring.application.name=broker-service
server.port=8083

# ============================================
# CONFIGURACI�N DE BASE DE DATOS MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/broker_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=morenopelon2011
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACI�N JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# RABBITMQ CONFIGURATION
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ============================================
# SPRING CLOUD STREAM - CONSUMER
# ============================================
spring.cloud.function.definition=userCreated

# Consumer: Eventos de creaci�n de usuarios
spring.cloud.stream.bindings.userCreated-in-0.destination=user.events
spring.cloud.stream.bindings.userCreated-in-0.group=broker-service
spring.cloud.stream.bindings.userCreated-in-0.contentType=application/json

# Configuraci�n de retry
spring.cloud.stream.bindings.userCreated-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffInitialInterval=1000
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMultiplier=2.0

# RabbitMQ espec�fico del consumidor
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.bindingRoutingKey=user.created
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.autoBindDlq=true

# ============================================
# CONFIGURACI�N DE LOGGING
# ============================================
logging.level.com.cuellar.brokerservice=DEBUG
logging.level.org.springframework.cloud.stream=DEBUG
logging.level.org.springframework.amqp=DEBUG
