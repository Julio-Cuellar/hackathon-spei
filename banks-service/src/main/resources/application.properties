# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
spring.application.name=banks-service
server.port=8082

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/banks_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=Nacho2348
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de charset UTF-8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# ============================================
# CONFIGURACIÓN DE EUREKA CLIENT (si lo usas)
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging.level.com.cuellar.banksservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
