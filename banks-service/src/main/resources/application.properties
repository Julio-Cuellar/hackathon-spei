# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
spring.application.name=banks-service
server.port=8082

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/banks_service?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Configuración de charset UTF-8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# ============================================
# CONFIGURACIÓN DE EUREKA CLIENT
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================
# CONFIGURACIÓN DE RabbitMQ
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Habilitar confirmaciones de publicación (publisher confirms)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ============================================
# CONFIGURACIÓN DE SPRING CLOUD STREAM
# ============================================
# Definición de funciones: consumer (userCreated) no necesita declararse para StreamBridge
spring.cloud.function.definition=userCreated

# ============================================
# CONSUMER: Eventos de creación de usuarios
# ============================================
# Binding del consumidor de eventos
spring.cloud.stream.bindings.userCreated-in-0.destination=user.events
spring.cloud.stream.bindings.userCreated-in-0.group=banks-service
spring.cloud.stream.bindings.userCreated-in-0.contentType=application/json

# Configuración de retry del consumidor
spring.cloud.stream.bindings.userCreated-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffInitialInterval=1000
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMultiplier=2.0
spring.cloud.stream.bindings.userCreated-in-0.consumer.backOffMaxInterval=5000

# RabbitMQ específico del consumidor
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.bindingRoutingKey=user.created
spring.cloud.stream.rabbit.bindings.userCreated-in-0.consumer.autoBindDlq=true

# ============================================
# PRODUCER: Eventos de cuenta CLABE agregada
# ============================================
# Binding del productor de eventos (usado por StreamBridge)
spring.cloud.stream.bindings.cuentaClabeAdded-out-0.destination=bank.events
spring.cloud.stream.bindings.cuentaClabeAdded-out-0.contentType=application/json

# RabbitMQ específico del productor
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-out-0.producer.routingKeyExpression='cuenta.clabe.added'
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-out-0.producer.exchangeType=topic
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-out-0.producer.declareExchange=true
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-out-0.producer.bindingRoutingKey=cuenta.clabe.added

# Confirmaciones de publicación para el producer
spring.cloud.stream.rabbit.bindings.cuentaClabeAdded-out-0.producer.confirmAckChannel=true

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging.level.com.cuellar.banksservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.stream=DEBUG
logging.level.org.springframework.amqp=DEBUG
